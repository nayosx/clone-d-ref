<div class="p-fluid dialog-container">
  <div>
    <i class="pi pi-checl" class="icon"></i>
    <h2 class="mt-3 font-bold">Titulo</h2>
  </div>

  <div class="text-left flex flex-column">
    <label class="mt-2 text-sm text-left text-gray-700 font-bold" for="textArea"
      >Label</label
    >
    <textarea
      id="textArea"
      rows="3"
      cols="50"
      [(ngModel)]="inputValue"
      pTextarea
      [autoResize]="false"
    ></textarea>
  </div>

  <div class="p-mt-3 flex justify-content-end gap-2">
    <button
      pButton
      type="button"
      label="Cancelar"
      class="p-button-secondary"
      (click)="cancelar()"
    ></button>
    <button pButton type="button" label="Aceptar" (click)="aceptar()"></button>
  </div>
</div>
