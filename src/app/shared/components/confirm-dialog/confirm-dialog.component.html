<p-confirmDialog [closable]="false">
  <ng-template pTemplate="message" let-message>
    <div class="text-center p-4">

      <i [class]="message.icon" [ngStyle]="{'font-size': '4rem', 'color': message.color}"></i>
      <h2 class="mt-3 font-bold">{{ message.title }}</h2>
      @if(message.message){
      <p class="mt-2 text-gray-700" [innerHTML]="message.message"></p>
      }
    </div>
  </ng-template>

</p-confirmDialog>
